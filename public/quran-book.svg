<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Drop Shadow for Realistic Depth -->
    <filter id="quranShadow" x="-10%" y="-10%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.36" />
    </filter>

    <!-- Cover Leather Gradient: Deep Royal Islamic Emerald Green -->
    <linearGradient id="quranLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#165135" />
      <stop offset="45%" stop-color="#0e3a25" />
      <stop offset="100%" stop-color="#062014" />
    </linearGradient>

    <!-- Spine Leather Gradient with 3D cylindrical shine -->
    <linearGradient id="quranSpineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#071f14" />
      <stop offset="35%" stop-color="#1c5d3d" />
      <stop offset="70%" stop-color="#12432b" />
      <stop offset="100%" stop-color="#072216" />
    </linearGradient>

    <!-- Gilded Gold Foil Gradient (Authentic Mushaf Gold Leaf) -->
    <linearGradient id="quranGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0b3" />
      <stop offset="25%" stop-color="#eec765" />
      <stop offset="55%" stop-color="#c99c36" />
      <stop offset="85%" stop-color="#f5d67e" />
      <stop offset="100%" stop-color="#b68523" />
    </linearGradient>

    <!-- Radial Gold Sheen for Medallion -->
    <radialGradient id="goldSheen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5cc" />
      <stop offset="60%" stop-color="#e0b44e" />
      <stop offset="100%" stop-color="#a67318" />
    </radialGradient>

    <!-- Page Edges Gradient (Cream & Gold Gilded Mushaf Paper) -->
    <linearGradient id="quranPageEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faf3e8" />
      <stop offset="35%" stop-color="#e9ddc4" />
      <stop offset="70%" stop-color="#f7efe0" />
      <stop offset="100%" stop-color="#d6c69e" />
    </linearGradient>

    <!-- Bookmark Silk Ribbon (Royal Gold Silk) -->
    <linearGradient id="quranRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe38a" />
      <stop offset="60%" stop-color="#d4a02c" />
      <stop offset="100%" stop-color="#8f6311" />
    </linearGradient>
  </defs>

  <g filter="url(#quranShadow)">
    <!-- Back Cover Shadow & Edge -->
    <rect x="13.5" y="8" width="39.5" height="49" rx="3" fill="#04140c" />

    <!-- Pages Block (Bottom and Right Gilded Paper Edge) -->
    <path d="M19 11.5 H50.5 C51.3 11.5 52 12.2 52 13 V53.5 C52 54.3 51.3 55 50.5 55 H19 V11.5 Z" fill="url(#quranPageEdge)" />
    <!-- Fine Page Lines for Realistic Bound Quran Feel -->
    <path d="M51 14.5V52.5M49.5 13.5V53M48 13V53.5" stroke="#caa662" stroke-width="0.5" stroke-linecap="round" opacity="0.65" />
    <path d="M22 54H50M22 52.5H49" stroke="#caa662" stroke-width="0.5" stroke-linecap="round" opacity="0.65" />

    <!-- Silk Bookmark Ribbon dangling out bottom -->
    <path d="M34 47 C34 53, 31.5 56.5, 35.5 61 L37.5 57.5 L39.5 61 C38.5 56.5, 36 53, 36 47 Z" fill="url(#quranRibbon)" />

    <!-- Front Cover (Leather bound with rounded outer corners) -->
    <path d="M16 8 H48.5 C50.4 8 52 9.6 52 11.5 V52.5 C52 54.4 50.4 56 48.5 56 H16 V8 Z" fill="url(#quranLeather)" />

    <!-- Spine (Rounded Left Edge with 3D Depth) -->
    <path d="M12.5 10.5 C12.5 9.1 13.6 8 15 8 H17.5 V56 H15 C13.6 56 12.5 54.9 12.5 53.5 V10.5 Z" fill="url(#quranSpineGrad)" />

    <!-- Spine Gold Tooling Ribs -->
    <line x1="13" y1="13.5" x2="17.5" y2="13.5" stroke="url(#quranGold)" stroke-width="1.3" stroke-linecap="round" />
    <line x1="13" y1="22.5" x2="17.5" y2="22.5" stroke="url(#quranGold)" stroke-width="1.3" stroke-linecap="round" />
    <line x1="13" y1="41.5" x2="17.5" y2="41.5" stroke="url(#quranGold)" stroke-width="1.3" stroke-linecap="round" />
    <line x1="13" y1="50.5" x2="17.5" y2="50.5" stroke="url(#quranGold)" stroke-width="1.3" stroke-linecap="round" />

    <!-- Spine Hinge Crease -->
    <line x1="17.5" y1="8" x2="17.5" y2="56" stroke="#04130a" stroke-width="0.9" opacity="0.8" />
    <line x1="18.5" y1="8" x2="18.5" y2="56" stroke="#226442" stroke-width="0.5" opacity="0.65" />

    <!-- Front Cover Outer Gold Foil Frame (Traditional Medina Mushaf Double Border) -->
    <rect x="20.5" y="11" width="28.5" height="42" rx="1.8" stroke="url(#quranGold)" stroke-width="0.95" fill="none" />
    <!-- Inner Fine Islamic Frame with scalloped/inset feel -->
    <rect x="22.2" y="12.7" width="25.1" height="38.6" rx="1.2" stroke="url(#quranGold)" stroke-width="0.5" stroke-dasharray="1.6 1" fill="none" opacity="0.85" />

    <!-- Corner Arabesque Palmettes (Authentic Islamic Manuscript Corner Ornaments) -->
    <g stroke="url(#quranGold)" stroke-width="0.75" stroke-linecap="round" fill="none">
      <path d="M21.5 15.5 Q24 15.5 24.5 13" />
      <path d="M47.5 15.5 Q45 15.5 44.5 13" />
      <path d="M21.5 48.5 Q24 48.5 24.5 51" />
      <path d="M47.5 48.5 Q45 48.5 44.5 51" />
    </g>

    <!-- Center Islamic Shamsa / Solar Medallion (Classic Holy Quran Illumination) -->
    <g transform="translate(34.8, 25.5)">
      <!-- Outer Radiant Rosette Ring -->
      <circle cx="0" cy="0" r="8" fill="none" stroke="url(#quranGold)" stroke-width="0.55" stroke-dasharray="1.2 0.8" opacity="0.85" />
      
      <!-- 16-Ray Shamsa Rosette -->
      <polygon points="0,-7 1.4,-3 4.9,-4.9 3,-1.4 7,0 3,1.4 4.9,4.9 1.4,3 0,7 -1.4,3 -4.9,4.9 -3,1.4 -7,0 -3,-1.4 -4.9,-4.9 -1.4,-3" fill="url(#goldSheen)" opacity="0.75" />
      
      <!-- 8-Pointed Central Star Medallion -->
      <polygon points="0,-5.8 1.8,-1.8 5.8,0 1.8,1.8 0,5.8 -1.8,1.8 -5.8,0 -1.8,-1.8" fill="url(#quranGold)" />
      <polygon points="-4.1,-4.1 0,-2.2 4.1,-4.1 2.2,0 4.1,4.1 0,2.2 -4.1,4.1 -2.2,0" fill="url(#quranGold)" opacity="0.9" />
      
      <!-- Emerald Jewel Center -->
      <circle cx="0" cy="0" r="2.2" fill="#0c3220" stroke="url(#quranGold)" stroke-width="0.65" />
      <circle cx="0" cy="0" r="0.9" fill="url(#quranGold)" />
    </g>

    <!-- Arabic Calligraphy Inscription: 'القرآن الكريم' (The Noble Quran) in Traditional Gold Script -->
    <g fill="url(#quranGold)">
      <!-- Line 1: 'القرآن' (Al-Quran) -->
      <!-- Alif (ا) -->
      <path d="M28.2 35.8 H29.3 V41.6 H28.2 Z" />
      <!-- Lam (ل) joined to Qaf (ق) -->
      <path d="M30.2 35.5 H31.3 V40.8 C31.3 41.5 31.7 41.8 32.4 41.8 H35.6 V40.9 H33 C32.5 40.9 32.3 40.7 32.3 40.3 V35.5 H33.4 V34.8 H30.2 Z" />
      <!-- Qaf loop (ق) -->
      <path d="M33.2 38.6 C33.2 37.8 33.9 37.3 34.8 37.3 C35.7 37.3 36.3 37.8 36.3 38.6 C36.3 39.3 35.6 39.8 34.7 39.8 C33.8 39.8 33.2 39.3 33.2 38.6 Z M34.8 38.1 C34.3 38.1 34 38.3 34 38.6 C34 38.9 34.3 39.1 34.8 39.1 C35.2 39.1 35.5 38.9 35.5 38.6 C35.5 38.3 35.2 38.1 34.8 38.1 Z" />
      <!-- Two dots for Qaf (ق) -->
      <circle cx="34.1" cy="36.2" r="0.5" />
      <circle cx="35.4" cy="36.2" r="0.5" />
      
      <!-- Ra (ر) descending sweep -->
      <path d="M36.2 39.8 C36.6 40.5 37.2 41.5 38.2 41.9 L37.8 42.6 C36.4 42.1 35.8 40.8 35.4 39.8 Z" />
      
      <!-- Alif with Maddah (آ) -->
      <path d="M38.8 36.2 H39.9 V41.8 H38.8 Z" />
      <!-- Maddah mark (~) -->
      <path d="M38.4 35.2 Q39.2 34.6 39.8 35.3 Q40.4 35.9 41 35.2" stroke="url(#quranGold)" stroke-width="0.5" fill="none" stroke-linecap="round" />
      
      <!-- Nun (ن) crescent with dot -->
      <path d="M40.5 38.8 C40.7 40.4 41.6 41.5 42.8 41.5 C43.8 41.5 44.5 40.6 44.6 39.2 H43.6 C43.5 40.2 43.1 40.7 42.7 40.7 C42.1 40.7 41.6 39.9 41.5 38.8 Z" />
      <circle cx="42.6" cy="38.4" r="0.55" />

      <!-- Line 2: Subtle Gold Calligraphic Flourish / 'الكريم' honorific motif -->
      <path d="M31.5 44.2 Q34.8 45.2 38.2 44.2" stroke="url(#quranGold)" stroke-width="0.6" stroke-linecap="round" fill="none" opacity="0.9" />
      <circle cx="34.8" cy="44.7" r="0.5" />
    </g>

    <!-- Top & Bottom Gold Filigree Finials -->
    <path d="M30.5 16.2 Q34.8 17.4 39 16.2" stroke="url(#quranGold)" stroke-width="0.65" stroke-linecap="round" fill="none" opacity="0.85" />
    <path d="M30.5 48.2 Q34.8 47 39 48.2" stroke="url(#quranGold)" stroke-width="0.65" stroke-linecap="round" fill="none" opacity="0.85" />
  </g>
</svg>
