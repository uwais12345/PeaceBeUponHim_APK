<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Drop Shadow for Realistic Depth -->
    <filter id="duaShadow" x="-10%" y="-10%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.34" />
    </filter>

    <!-- Cover Leather Gradient: Deep Emerald Green -->
    <linearGradient id="duaLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b5a3d" />
      <stop offset="45%" stop-color="#12432c" />
      <stop offset="100%" stop-color="#082618" />
    </linearGradient>

    <!-- Spine Leather Gradient with 3D cylindrical shine -->
    <linearGradient id="duaSpine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#072014" />
      <stop offset="35%" stop-color="#1e6141" />
      <stop offset="70%" stop-color="#14482f" />
      <stop offset="100%" stop-color="#082618" />
    </linearGradient>

    <!-- Gilded Gold Leaf Gradient -->
    <linearGradient id="duaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2bd" />
      <stop offset="30%" stop-color="#ebc267" />
      <stop offset="70%" stop-color="#c69935" />
      <stop offset="100%" stop-color="#f8dc8a" />
    </linearGradient>

    <!-- Radial Gold Glow for Medallion -->
    <radialGradient id="duaMedallionGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8d6" />
      <stop offset="65%" stop-color="#e3b652" />
      <stop offset="100%" stop-color="#a87519" />
    </radialGradient>

    <!-- Gilded Paper Edges -->
    <linearGradient id="duaPaperEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7eee2" />
      <stop offset="35%" stop-color="#e8dcc1" />
      <stop offset="70%" stop-color="#f6efe3" />
      <stop offset="100%" stop-color="#d9cba7" />
    </linearGradient>

    <!-- Silk Ribbon -->
    <linearGradient id="duaRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffea94" />
      <stop offset="60%" stop-color="#d6a32f" />
      <stop offset="100%" stop-color="#8f6311" />
    </linearGradient>
  </defs>

  <g filter="url(#duaShadow)">
    <!-- Back Cover Shadow & Edge -->
    <rect x="13.5" y="8" width="39.5" height="49" rx="3" fill="#04160d" />

    <!-- Pages Block (Bottom and Right Gilded Paper Edge) -->
    <path d="M19 11.5 H50.5 C51.3 11.5 52 12.2 52 13 V53.5 C52 54.3 51.3 55 50.5 55 H19 V11.5 Z" fill="url(#duaPaperEdge)" />
    <!-- Fine Page Lines -->
    <path d="M51 15V52.5M49.5 14V53M48 13.5V53.5" stroke="#ccbba3" stroke-width="0.5" stroke-linecap="round" opacity="0.6" />
    <path d="M22 54H50M22 52.5H49" stroke="#ccbba3" stroke-width="0.5" stroke-linecap="round" opacity="0.6" />

    <!-- Silk Bookmark Ribbon dangling out bottom -->
    <path d="M34 48 C34 54, 32 57, 36 61 L38 57.5 L40 61 C39 57, 36 54, 36 48 Z" fill="url(#duaRibbon)" />

    <!-- Front Cover (Leather bound with rounded right corners) -->
    <path d="M16 8 H48.5 C50.4 8 52 9.6 52 11.5 V52.5 C52 54.4 50.4 56 48.5 56 H16 V8 Z" fill="url(#duaLeather)" />

    <!-- Spine with 3D cylindrical volume -->
    <rect x="12" y="8" width="5" height="48" rx="1.5" fill="url(#duaSpine)" />
    <!-- Spine Gold Embossed Bands -->
    <rect x="12" y="14" width="5" height="1.2" fill="url(#duaGold)" opacity="0.85" />
    <rect x="12" y="24" width="5" height="1.2" fill="url(#duaGold)" opacity="0.85" />
    <rect x="12" y="38" width="5" height="1.2" fill="url(#duaGold)" opacity="0.85" />
    <rect x="12" y="48" width="5" height="1.2" fill="url(#duaGold)" opacity="0.85" />

    <!-- Gilded Outer Border on Front Cover -->
    <rect x="18.5" y="10.5" width="31" height="43" rx="2" stroke="url(#duaGold)" stroke-width="0.9" fill="none" opacity="0.92" />
    <!-- Inset Corner Accents -->
    <path d="M18.5 14.5 H22.5 V10.5 M49.5 14.5 H45.5 V10.5 M18.5 49.5 H22.5 V53.5 M49.5 49.5 H45.5 V53.5" stroke="url(#duaGold)" stroke-width="0.7" fill="none" opacity="0.85" />

    <!-- Inner Framing Arch -->
    <path d="M22 20 C22 17, 46 17, 46 20 V44 C46 47, 22 47, 22 44 Z" stroke="url(#duaGold)" stroke-width="0.6" stroke-dasharray="1.5 1" opacity="0.6" />

    <!-- Central Ornate Medallion (Dua Theme) -->
    <circle cx="34" cy="32" r="10" fill="url(#duaMedallionGlow)" />
    <circle cx="34" cy="32" r="9.3" stroke="#0e3a25" stroke-width="0.7" opacity="0.3" fill="none" />
    <circle cx="34" cy="32" r="10.7" stroke="url(#duaGold)" stroke-width="0.5" fill="none" opacity="0.8" />

    <!-- Cupped Praying Hands (Dua / Munajat) Silhouette in Medallion -->
    <!-- Left Hand -->
    <path d="M32.5 35.8 C31.8 35.8 28.8 34.6 28.5 32 C28.2 29.8 29.4 28.2 30.1 27.2 C30.4 26.8 31 27.1 30.9 27.6 C30.6 28.7 30.4 30.2 31.4 31.2 C32 31.8 32.5 32.6 32.7 33.6 Z" fill="#0c351f" />
    <path d="M31.2 27.2 C31.5 26.6 32.2 26.8 32.1 27.4 C31.8 28.5 31.8 29.8 32.7 30.8 C32.9 31 32.8 31.3 32.5 31.2 C31.7 30.4 30.8 28.6 31.2 27.2 Z" fill="#0c351f" />

    <!-- Right Hand (Mirrored) -->
    <path d="M35.5 35.8 C36.2 35.8 39.2 34.6 39.5 32 C39.8 29.8 38.6 28.2 37.9 27.2 C37.6 26.8 37 27.1 37.1 27.6 C37.4 28.7 37.6 30.2 36.6 31.2 C36 31.8 35.5 32.6 35.3 33.6 Z" fill="#0c351f" />
    <path d="M36.8 27.2 C36.5 26.6 35.8 26.8 35.9 27.4 C36.2 28.5 36.2 29.8 35.3 30.8 C35.1 31 35.2 31.3 35.5 31.2 C36.3 30.4 37.2 28.6 36.8 27.2 Z" fill="#0c351f" />

    <!-- Joined Base of Hands (Cupped) -->
    <path d="M31.2 35.4 C32.5 36.6 35.5 36.6 36.8 35.4 C36 36.2 32 36.2 31.2 35.4 Z" fill="#082616" />

    <!-- Subtle Celestial Radiant Rays above Hands -->
    <circle cx="34" cy="25" r="0.75" fill="#fff9db" />
    <circle cx="31.5" cy="25.8" r="0.5" fill="#fff9db" />
    <circle cx="36.5" cy="25.8" r="0.5" fill="#fff9db" />

    <!-- Corner Decorative Rosettes -->
    <circle cx="21.5" cy="13.5" r="1.1" fill="url(#duaGold)" />
    <circle cx="46.5" cy="13.5" r="1.1" fill="url(#duaGold)" />
    <circle cx="21.5" cy="50.5" r="1.1" fill="url(#duaGold)" />
    <circle cx="46.5" cy="50.5" r="1.1" fill="url(#duaGold)" />
  </g>
</svg>
