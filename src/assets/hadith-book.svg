<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Drop Shadow for Realistic Depth -->
    <filter id="bookShadow" x="-10%" y="-10%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.32" />
    </filter>

    <!-- Cover Leather Gradient: Deep Emerald Green -->
    <linearGradient id="leatherCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#195438" />
      <stop offset="45%" stop-color="#12432c" />
      <stop offset="100%" stop-color="#09281a" />
    </linearGradient>

    <!-- Spine Leather Gradient with 3D cylindrical shine -->
    <linearGradient id="spineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#092518" />
      <stop offset="35%" stop-color="#1d5c3f" />
      <stop offset="70%" stop-color="#14462e" />
      <stop offset="100%" stop-color="#0a2a1c" />
    </linearGradient>

    <!-- Gilded Gold Foil Gradient -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2b8" />
      <stop offset="30%" stop-color="#e8be65" />
      <stop offset="70%" stop-color="#c49733" />
      <stop offset="100%" stop-color="#f7da87" />
    </linearGradient>

    <!-- Page Edges Gradient (Cream & Gold Gilded Edge) -->
    <linearGradient id="pageEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5ede0" />
      <stop offset="30%" stop-color="#e6dabf" />
      <stop offset="70%" stop-color="#f5ede0" />
      <stop offset="100%" stop-color="#d9caa4" />
    </linearGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0cb75" />
      <stop offset="100%" stop-color="#b88320" />
    </linearGradient>
  </defs>

  <g filter="url(#bookShadow)">
    <!-- Back Cover Shadow & Edge -->
    <rect x="13.5" y="8" width="39.5" height="49" rx="3" fill="#061c12" />

    <!-- Pages Block (Bottom and Right Gilded Paper Edge) -->
    <path d="M19 11.5 H50.5 C51.3 11.5 52 12.2 52 13 V53.5 C52 54.3 51.3 55 50.5 55 H19 V11.5 Z" fill="url(#pageEdge)" />
    <!-- Fine Page Lines -->
    <path d="M51 15V52.5M49.5 14V53M48 13.5V53.5" stroke="#cbb991" stroke-width="0.5" stroke-linecap="round" opacity="0.6" />
    <path d="M22 54H50M22 52.5H49" stroke="#cbb991" stroke-width="0.5" stroke-linecap="round" opacity="0.6" />

    <!-- Silk Bookmark Ribbon dangling out bottom -->
    <path d="M34 48 C34 54, 32 57, 36 61 L38 57.5 L40 61 C39 57, 36 54, 36 48 Z" fill="url(#ribbonGrad)" />

    <!-- Front Cover (Leather bound with rounded right corners) -->
    <path d="M16 8 H48.5 C50.4 8 52 9.6 52 11.5 V52.5 C52 54.4 50.4 56 48.5 56 H16 V8 Z" fill="url(#leatherCover)" />

    <!-- Spine (Rounded Left Edge with 3D Depth) -->
    <path d="M12.5 10.5 C12.5 9.1 13.6 8 15 8 H17.5 V56 H15 C13.6 56 12.5 54.9 12.5 53.5 V10.5 Z" fill="url(#spineGradient)" />

    <!-- Spine Gold Tooling Ribs -->
    <line x1="13" y1="14" x2="17.5" y2="14" stroke="url(#goldFoil)" stroke-width="1.2" stroke-linecap="round" />
    <line x1="13" y1="23" x2="17.5" y2="23" stroke="url(#goldFoil)" stroke-width="1.2" stroke-linecap="round" />
    <line x1="13" y1="41" x2="17.5" y2="41" stroke="url(#goldFoil)" stroke-width="1.2" stroke-linecap="round" />
    <line x1="13" y1="50" x2="17.5" y2="50" stroke="url(#goldFoil)" stroke-width="1.2" stroke-linecap="round" />

    <!-- Spine Hinge Crease -->
    <line x1="17.5" y1="8" x2="17.5" y2="56" stroke="#05190e" stroke-width="0.8" opacity="0.75" />
    <line x1="18.5" y1="8" x2="18.5" y2="56" stroke="#256b49" stroke-width="0.5" opacity="0.6" />

    <!-- Front Cover Outer Gold Foil Frame -->
    <rect x="20.5" y="11" width="28.5" height="42" rx="1.8" stroke="url(#goldFoil)" stroke-width="0.9" fill="none" />
    <!-- Inner Delicate Gold Inset Frame -->
    <rect x="22.5" y="13" width="24.5" height="38" rx="1" stroke="url(#goldFoil)" stroke-width="0.5" stroke-dasharray="1.5 1" fill="none" opacity="0.85" />

    <!-- Gold Corner Arabesque Accents -->
    <path d="M22 15.5 L24.5 15.5 M22 15.5 L22 18" stroke="url(#goldFoil)" stroke-width="0.8" stroke-linecap="round" />
    <path d="M47 15.5 L44.5 15.5 M47 15.5 L47 18" stroke="url(#goldFoil)" stroke-width="0.8" stroke-linecap="round" />
    <path d="M22 48.5 L24.5 48.5 M22 48.5 L22 46" stroke="url(#goldFoil)" stroke-width="0.8" stroke-linecap="round" />
    <path d="M47 48.5 L44.5 48.5 M47 48.5 L47 46" stroke="url(#goldFoil)" stroke-width="0.8" stroke-linecap="round" />

    <!-- Center Islamic Medallion (Shamsa / Star Medallion) -->
    <g transform="translate(34.8, 25.5)">
      <!-- Outer Petal Radiance -->
      <circle cx="0" cy="0" r="7.5" fill="none" stroke="url(#goldFoil)" stroke-width="0.5" stroke-dasharray="1 1" opacity="0.8" />
      <!-- 8-Pointed Star Medallion -->
      <polygon points="0,-6.2 1.8,-1.8 6.2,0 1.8,1.8 0,6.2 -1.8,1.8 -6.2,0 -1.8,-1.8" fill="url(#goldFoil)" />
      <polygon points="-4.4,-4.4 0,-2.5 4.4,-4.4 2.5,0 4.4,4.4 0,2.5 -4.4,4.4 -2.5,0" fill="url(#goldFoil)" opacity="0.9" />
      <circle cx="0" cy="0" r="2.2" fill="#0e3a2d" stroke="url(#goldFoil)" stroke-width="0.6" />
      <circle cx="0" cy="0" r="0.8" fill="url(#goldFoil)" />
    </g>

    <!-- Arabic Calligraphy Inscription: 'الحديث' (Al-Hadith) in Traditional Gold Script -->
    <g fill="url(#goldFoil)">
      <!-- Elegantly handcrafted vector calligraphy curves for 'الحديث' -->
      <!-- Alif & Lam -->
      <path d="M30 36.2 H31.2 V42 H30 Z" />
      <path d="M32.2 35.8 H33.4 V42.2 C33.4 43 33.8 43.4 34.6 43.4 H39.5 V42.4 H35 C34.4 42.4 34.2 42.2 34.2 41.8 V35.8 H35.4 V35 H32.2 Z" />
      <!-- Ha (ح) & Dal (د) -->
      <path d="M34.8 39.5 C35.4 38.6 36.6 38.2 37.8 38.2 C39 38.2 39.8 38.8 39.5 39.8 C39.2 40.8 38.2 41.2 37.2 41.2 H35.8 C35.4 40.5 35.1 40 34.8 39.5 Z" opacity="0.95" />
      <!-- Ya (ي) & Tha (ث) ligature with three dots -->
      <path d="M39.2 40.5 C40 40.2 40.8 39.6 41.6 38.5 L42.4 39 C41.6 40.4 40.4 41.6 39 42.2 Z" />
      <!-- Three Traditional Arabic Nuqta (Dots) for Tha (ث) -->
      <circle cx="38" cy="36.6" r="0.65" />
      <circle cx="39.5" cy="36.6" r="0.65" />
      <circle cx="38.75" cy="35.3" r="0.65" />
    </g>

    <!-- Top & Bottom Gold Filigree Accents -->
    <path d="M31 16.5 Q34.8 17.5 38.5 16.5" stroke="url(#goldFoil)" stroke-width="0.6" stroke-linecap="round" fill="none" opacity="0.85" />
    <path d="M31 48 Q34.8 47 38.5 48" stroke="url(#goldFoil)" stroke-width="0.6" stroke-linecap="round" fill="none" opacity="0.85" />
  </g>
</svg>
