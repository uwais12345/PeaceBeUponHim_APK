<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Drop Shadow for Realistic Depth -->
    <filter id="salahShadow" x="-10%" y="-10%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.34" />
    </filter>

    <!-- Cover Leather Gradient: Deep Emerald Green -->
    <linearGradient id="salahLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#195438" />
      <stop offset="45%" stop-color="#12432c" />
      <stop offset="100%" stop-color="#082618" />
    </linearGradient>

    <!-- Spine Leather Gradient -->
    <linearGradient id="salahSpine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#072014" />
      <stop offset="35%" stop-color="#1e6141" />
      <stop offset="70%" stop-color="#14482f" />
      <stop offset="100%" stop-color="#082618" />
    </linearGradient>

    <!-- Gilded Gold Foil Gradient -->
    <linearGradient id="salahGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2bd" />
      <stop offset="30%" stop-color="#ebc267" />
      <stop offset="70%" stop-color="#c69935" />
      <stop offset="100%" stop-color="#f8dc8a" />
    </linearGradient>

    <!-- Radial Gold Sheen -->
    <radialGradient id="mihrabGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff8d6" />
      <stop offset="60%" stop-color="#e3b652" />
      <stop offset="100%" stop-color="#a87519" />
    </radialGradient>

    <!-- Gilded Paper Edges -->
    <linearGradient id="salahPaper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7eee2" />
      <stop offset="35%" stop-color="#e8dcc1" />
      <stop offset="70%" stop-color="#f6efe3" />
      <stop offset="100%" stop-color="#d9cba7" />
    </linearGradient>

    <!-- Silk Bookmark Ribbon -->
    <linearGradient id="salahRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffea94" />
      <stop offset="60%" stop-color="#d6a32f" />
      <stop offset="100%" stop-color="#8f6311" />
    </linearGradient>
  </defs>

  <g filter="url(#salahShadow)">
    <!-- Back Cover Shadow & Edge -->
    <rect x="13.5" y="8" width="39.5" height="49" rx="3" fill="#04160d" />

    <!-- Pages Block (Bottom and Right Gilded Paper Edge) -->
    <path d="M19 11.5 H50.5 C51.3 11.5 52 12.2 52 13 V53.5 C52 54.3 51.3 55 50.5 55 H19 V11.5 Z" fill="url(#salahPaper)" />
    <!-- Fine Page Lines -->
    <path d="M51 15V52.5M49.5 14V53M48 13.5V53.5" stroke="#ccbba3" stroke-width="0.5" stroke-linecap="round" opacity="0.6" />
    <path d="M22 54H50M22 52.5H49" stroke="#ccbba3" stroke-width="0.5" stroke-linecap="round" opacity="0.6" />

    <!-- Silk Bookmark Ribbon dangling out bottom -->
    <path d="M34 48 C34 54, 32 57, 36 61 L38 57.5 L40 61 C39 57, 36 54, 36 48 Z" fill="url(#salahRibbon)" />

    <!-- Front Cover (Leather bound) -->
    <path d="M16 8 H48.5 C50.4 8 52 9.6 52 11.5 V52.5 C52 54.4 50.4 56 48.5 56 H16 V8 Z" fill="url(#salahLeather)" />

    <!-- Spine with 3D cylindrical shine -->
    <rect x="12" y="8" width="5" height="48" rx="1.5" fill="url(#salahSpine)" />
    <!-- Spine Gold Embossed Bands -->
    <rect x="12" y="14" width="5" height="1.2" fill="url(#salahGold)" opacity="0.85" />
    <rect x="12" y="24" width="5" height="1.2" fill="url(#salahGold)" opacity="0.85" />
    <rect x="12" y="38" width="5" height="1.2" fill="url(#salahGold)" opacity="0.85" />
    <rect x="12" y="48" width="5" height="1.2" fill="url(#salahGold)" opacity="0.85" />

    <!-- Gilded Outer Border on Front Cover -->
    <rect x="18.5" y="10.5" width="31" height="43" rx="2" stroke="url(#salahGold)" stroke-width="0.9" fill="none" opacity="0.92" />
    <!-- Inset Corner Accents -->
    <path d="M18.5 14.5 H22.5 V10.5 M49.5 14.5 H45.5 V10.5 M18.5 49.5 H22.5 V53.5 M49.5 49.5 H45.5 V53.5" stroke="url(#salahGold)" stroke-width="0.7" fill="none" opacity="0.85" />

    <!-- EMBOSSED PRAYER MIHRAB ARCH (After Salah / Prayer Niche) -->
    <!-- Outer Arch Frame -->
    <path d="M25 45 V27 C25 21, 34 16, 34 16 C34 16, 43 21, 43 27 V45 H25 Z" stroke="url(#salahGold)" stroke-width="0.8" fill="none" opacity="0.9" />
    
    <!-- Inner Arch Backing with Gold Sheen -->
    <path d="M26.5 44 V27.5 C26.5 22.5, 34 18, 34 18 C34 18, 41.5 22.5, 41.5 27.5 V44 H26.5 Z" fill="url(#mihrabGlow)" opacity="0.9" />

    <!-- Mihrab Interior Silhouette: Kaaba & Dome Motif -->
    <!-- Kaaba Cube in Center of Arch -->
    <rect x="30" y="31" width="8" height="9" rx="0.5" fill="#0b2c1b" />
    <!-- Gold Kiswah Band on Kaaba -->
    <line x1="30" y1="33" x2="38" y2="33" stroke="url(#salahGold)" stroke-width="0.8" />
    <rect x="33.2" y="35" width="1.6" height="5" fill="url(#salahGold)" opacity="0.9" />

    <!-- Elegant Dome & Crescent Atop Arch -->
    <path d="M34 21 C31.5 24, 31.5 27, 34 27 C36.5 27, 36.5 24, 34 21 Z" fill="#0b2c1b" opacity="0.8" />
    <circle cx="34" cy="20" r="0.9" fill="#0b2c1b" />

    <!-- Miniature Prayer Beads Arc hanging across base -->
    <path d="M24 45.5 C29 48.5, 39 48.5, 44 45.5" stroke="url(#salahGold)" stroke-width="0.7" stroke-dasharray="1 1.2" opacity="0.8" />

    <!-- Corner Rosettes -->
    <circle cx="21.5" cy="13.5" r="1.1" fill="url(#salahGold)" />
    <circle cx="46.5" cy="13.5" r="1.1" fill="url(#salahGold)" />
    <circle cx="21.5" cy="50.5" r="1.1" fill="url(#salahGold)" />
    <circle cx="46.5" cy="50.5" r="1.1" fill="url(#salahGold)" />
  </g>
</svg>
