<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Drop Shadow for Multi-Book Depth -->
    <filter id="libShadow" x="-10%" y="-10%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.36" />
    </filter>

    <!-- Emerald Leathers with varying tones for distinction -->
    <linearGradient id="book1Leather" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#092518" />
      <stop offset="40%" stop-color="#195438" />
      <stop offset="80%" stop-color="#12432c" />
      <stop offset="100%" stop-color="#071f14" />
    </linearGradient>

    <linearGradient id="book2Leather" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c2e1f" />
      <stop offset="40%" stop-color="#216a47" />
      <stop offset="80%" stop-color="#164d33" />
      <stop offset="100%" stop-color="#0a261a" />
    </linearGradient>

    <linearGradient id="book3Leather" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#071f14" />
      <stop offset="40%" stop-color="#185237" />
      <stop offset="80%" stop-color="#0f3c27" />
      <stop offset="100%" stop-color="#061a11" />
    </linearGradient>

    <!-- Gilded Gold Foil Gradient -->
    <linearGradient id="libGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2bd" />
      <stop offset="30%" stop-color="#ebc267" />
      <stop offset="70%" stop-color="#c69935" />
      <stop offset="100%" stop-color="#f8dc8a" />
    </linearGradient>

    <!-- Gilded Top Page Edges -->
    <linearGradient id="libPaperTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8dcc1" />
      <stop offset="50%" stop-color="#f7eee2" />
      <stop offset="100%" stop-color="#d9cba7" />
    </linearGradient>

    <!-- Silk Bookmark Ribbon -->
    <linearGradient id="libRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffea94" />
      <stop offset="60%" stop-color="#d6a32f" />
      <stop offset="100%" stop-color="#8f6311" />
    </linearGradient>
  </defs>

  <g filter="url(#libShadow)">
    <!-- Base Library Shelf Support Shadow -->
    <ellipse cx="32" cy="57" rx="26" ry="2.5" fill="#000000" opacity="0.3" />

    <!-- BOOK 1 (Left Volume, Standing Tall) -->
    <g>
      <!-- Spine -->
      <rect x="11" y="14" width="11" height="42" rx="2" fill="url(#book1Leather)" />
      <!-- Top Paper Edge perspective -->
      <path d="M12 14 L14 11.5 H21 L19.5 14 Z" fill="url(#libPaperTop)" opacity="0.85" />
      <!-- Gold Embossed Spine Ribs -->
      <line x1="11" y1="19" x2="22" y2="19" stroke="url(#libGold)" stroke-width="1.2" />
      <line x1="11" y1="21" x2="22" y2="21" stroke="url(#libGold)" stroke-width="0.6" opacity="0.7" />
      <line x1="11" y1="48" x2="22" y2="48" stroke="url(#libGold)" stroke-width="0.6" opacity="0.7" />
      <line x1="11" y1="50" x2="22" y2="50" stroke="url(#libGold)" stroke-width="1.2" />
      <!-- Gold Title Cartouche / Plaque -->
      <rect x="13" y="27" width="7" height="13" rx="1.2" fill="url(#libGold)" opacity="0.9" />
      <rect x="14" y="29" width="5" height="9" rx="0.6" fill="#0c2e1f" />
      <circle cx="16.5" cy="33.5" r="1.2" fill="url(#libGold)" />
    </g>

    <!-- BOOK 2 (Center Volume, Grandest / Prominent) -->
    <g>
      <!-- Spine -->
      <rect x="24" y="10" width="14.5" height="46" rx="2.5" fill="url(#book2Leather)" />
      <!-- Top Paper Edge -->
      <path d="M25 10 L28 7 H37 L35.5 10 Z" fill="url(#libPaperTop)" opacity="0.9" />
      <!-- Gold Embossed Spine Ribs -->
      <line x1="24" y1="16" x2="38.5" y2="16" stroke="url(#libGold)" stroke-width="1.4" />
      <line x1="24" y1="18.5" x2="38.5" y2="18.5" stroke="url(#libGold)" stroke-width="0.7" opacity="0.7" />
      <line x1="24" y1="46.5" x2="38.5" y2="46.5" stroke="url(#libGold)" stroke-width="0.7" opacity="0.7" />
      <line x1="24" y1="49" x2="38.5" y2="49" stroke="url(#libGold)" stroke-width="1.4" />
      <!-- Center Ornate Arabesque Medallion on Spine -->
      <circle cx="31.25" cy="31" r="5" fill="url(#libGold)" />
      <circle cx="31.25" cy="31" r="4" fill="#09281a" />
      <path d="M31.25 28 L32.5 31 L31.25 34 L30 31 Z" fill="url(#libGold)" />
      <!-- Silk Bookmark Ribbon -->
      <path d="M29 55 C29 59, 27 61, 30 63 L32 60.5 L34 63 C33 61, 31 59, 31 55 Z" fill="url(#libRibbon)" />
    </g>

    <!-- BOOK 3 (Right Volume, Leaning against Center Volume) -->
    <g transform="translate(40, 15) rotate(11)">
      <!-- Spine -->
      <rect x="0" y="0" width="11" height="42" rx="2" fill="url(#book3Leather)" />
      <!-- Top Edge -->
      <path d="M1 0 L3 -2.5 H9 L8 0 Z" fill="url(#libPaperTop)" opacity="0.85" />
      <!-- Gold Ribs -->
      <line x1="0" y1="6" x2="11" y2="6" stroke="url(#libGold)" stroke-width="1.2" />
      <line x1="0" y1="35" x2="11" y2="35" stroke="url(#libGold)" stroke-width="1.2" />
      <!-- Gold Geometric Motif -->
      <rect x="2.5" y="16" width="6" height="10" rx="1.2" fill="url(#libGold)" opacity="0.9" />
      <rect x="3.5" y="17.5" width="4" height="7" rx="0.6" fill="#082215" />
      <line x1="5.5" y1="19" x2="5.5" y2="23" stroke="url(#libGold)" stroke-width="0.8" />
    </g>
  </g>
</svg>
